services:
  docling-proxy:
    build: .
    container_name: docling-proxy
    restart: unless-stopped
    ports:
      - "10.121.3.201:5005:5003"
    environment:
      - DOCLING_URL=${DOCLING_URL}
      - OCR_SDK_URL=${OCR_SDK_URL}
      - OCR_SDK_INBOX_HOST=${OCR_SDK_INBOX_HOST}
      - OCR_SDK_INBOX_CONTAINER=${OCR_SDK_INBOX_CONTAINER}
      - ENRICH_PICTURES_WITH_122B=${ENRICH_PICTURES_WITH_122B}
      - OCR_SDK_ENABLED=${OCR_SDK_ENABLED}
      - TEXT_PDF_VLM_THRESHOLD=${TEXT_PDF_VLM_THRESHOLD}
      - SCAN_PDF_FULL_PAGE=${SCAN_PDF_FULL_PAGE}
      # VLM endpoint (proxy gateway)
      - VLM_PROXY_ENABLED=${VLM_PROXY_ENABLED}
      - VLM_PROXY_URL=${VLM_PROXY_URL}
      - VLM_UPSTREAM_URL=${VLM_UPSTREAM_URL}
      - VLM_UPSTREAM_API_KEY=${VLM_UPSTREAM_API_KEY}
      - VLM_FULL_PAGE_TEMPERATURE=${VLM_FULL_PAGE_TEMPERATURE}
      - VLM_FULL_PAGE_TOP_P=${VLM_FULL_PAGE_TOP_P}
      - VLM_FULL_PAGE_TOP_K=${VLM_FULL_PAGE_TOP_K}
      - VLM_FULL_PAGE_MIN_P=${VLM_FULL_PAGE_MIN_P}
      - VLM_FULL_PAGE_PRESENCE_PENALTY=${VLM_FULL_PAGE_PRESENCE_PENALTY}
      - VLM_FULL_PAGE_REPETITION_PENALTY=${VLM_FULL_PAGE_REPETITION_PENALTY}
      - VLM_FULL_PAGE_MAX_TOKENS=${VLM_FULL_PAGE_MAX_TOKENS}
      - VLM_PICTURE_DESC_TEMPERATURE=${VLM_PICTURE_DESC_TEMPERATURE}
      - VLM_PICTURE_DESC_TOP_P=${VLM_PICTURE_DESC_TOP_P}
      - VLM_PICTURE_DESC_TOP_K=${VLM_PICTURE_DESC_TOP_K}
      - VLM_PICTURE_DESC_PRESENCE_PENALTY=${VLM_PICTURE_DESC_PRESENCE_PENALTY}
      - VLM_PICTURE_DESC_REPETITION_PENALTY=${VLM_PICTURE_DESC_REPETITION_PENALTY}
      - VLM_PICTURE_DESC_MAX_TOKENS=${VLM_PICTURE_DESC_MAX_TOKENS}
      - VLM_PROMPT_FULL_PAGE_FILE=${VLM_PROMPT_FULL_PAGE_FILE}
      - VLM_PROMPT_PICTURE_DESC_FILE=${VLM_PROMPT_PICTURE_DESC_FILE}
      # Adaptive image resize before upstream forward
      - VLM_FULL_PAGE_TARGET_PIXELS=${VLM_FULL_PAGE_TARGET_PIXELS}
      - VLM_PICTURE_DESC_TARGET_PIXELS=${VLM_PICTURE_DESC_TARGET_PIXELS}
      - VLM_MIN_PIXELS=${VLM_MIN_PIXELS}
      - VLM_TRUNCATE_SAVE_ORIGINAL_IMAGES=${VLM_TRUNCATE_SAVE_ORIGINAL_IMAGES}
      - VLM_REQUEST_LOG_FILE=${VLM_REQUEST_LOG_FILE}
      - VLM_TRUNCATE_LOG_DIR=${VLM_TRUNCATE_LOG_DIR}
      - VLM_TRUNCATE_SAVE_PAYLOAD=${VLM_TRUNCATE_SAVE_PAYLOAD}
      - VLM_TRUNCATE_RETENTION_DAYS=${VLM_TRUNCATE_RETENTION_DAYS}
      - VLM_REQUEST_LOG_RETENTION_DAYS=${VLM_REQUEST_LOG_RETENTION_DAYS}
      - VLM_REQUEST_LOG_MAX_SIZE_MB=${VLM_REQUEST_LOG_MAX_SIZE_MB}
      - NULL_RESPONSE_LOG_RETENTION_DAYS=${NULL_RESPONSE_LOG_RETENTION_DAYS}
      - ERROR_RESPONSE_LOG_RETENTION_DAYS=${ERROR_RESPONSE_LOG_RETENTION_DAYS}
    volumes:
      - /docker-shared/ocr-inbox:/inbox
      # Логи VLM endpoint'а: JSONL счётчики + truncate-дампы. Каталог
      # внутри контейнера — /proxy/logs (см. WORKDIR=/proxy в Dockerfile).
      - /docker-shared/docling-proxy-logs:/proxy/logs
      # Опциональные кастомные промпты (если файлы существуют — берутся,
      # иначе fallback на DEFAULT_*_PROMPT в main.py).
      - /docker-shared/docling-proxy-prompts:/proxy/prompts
